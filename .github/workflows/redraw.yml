name: redraw the year

on:
  schedule:
    - cron: "17 7 * * *"   # every night, ~2am toronto
  workflow_dispatch:
  push:                    # redraw as soon as i edit my milestones
    paths:
      - events.txt
      - scripts/year.py
  issues:                  # or open/edit/close an issue labelled "milestone"
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: redraw
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python scripts/year.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # github caches profile images by filename, so each redraw gets a timestamped name
      - name: give it a fresh name and point the readme at it
        run: |
          new="assets/year-$(date -u +%Y%m%d%H%M).svg"
          for f in assets/year-*.svg; do [ "$f" != "$new" ] && git rm -q "$f" || true; done
          mv assets/year.svg "$new"
          sed -i -E "s#assets/year(-[0-9]+)?\.svg#${new}#" README.md
      - name: commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "redraw the year" && git push)
