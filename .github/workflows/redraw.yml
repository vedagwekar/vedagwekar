name: redraw the year

on:
  schedule:
    - cron: "17 7 * * *"   # every night, ~2am toronto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python scripts/year.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add assets/year.svg
          git diff --cached --quiet || (git commit -m "redraw the year" && git push)
